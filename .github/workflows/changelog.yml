name: Generate Changelog

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  release:
    types: [published]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Set Git config
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"

      - name: Generate Changelog
        run: npm run release

      - name: Check for changes
        run: |
          git diff --exit-code || echo "Changes detected, ready to commit"

      - name: Commit and push changes
        run: |
          git add CHANGELOG.md package.json
          git diff --quiet || git commit -m "chore(release): 1.0.1" # Only commit if there are changes
          git push
